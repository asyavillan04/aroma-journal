<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="64x64" href="assets/logo-a.png">
    <title>Aroma Journal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">

    <script src="js/index.js" type="module"></script> 
</head>
<body>
    <h1>Aroma Journal</h1>

    <main id="main-content">

    </template>

    </main>

        <template id="ingredient-modal-template">
        <div class="journal-content"> 
        
            <div class="element"> <label for="name">Название: </label> <input type="text" placeholder="Введите название"> </div>

            <div class="element">     
                <label for="amount">Количество: </label> <input type="number" placeholder="Введите количество">
                <select name="measure" id="measure">
                    <option value="mg">мг</option>
                    <option value="ml">мл</option>
                </select>
            </div>

            <div class="element"> <label for="origin">Происхождение: </label> <input type="text"> </div>

            <div class="element"> 
                <label for="type">Тип: </label> 
                <select name="type" id="type">
                    <option type="essentialOil">Эфирное масло</option>
                    <option type="absolute">Абсолют</option>
                    <option type="other">Другое</option>
                </select>
            </div>

            <div class="element"> <label for="shelfLife">Срок годности: </label> </div>

            <div class="element"> <label for="aromaProfile">Ароматический профиль: </label> <input type="textarea" placeholder="Описание аромата компонента"> </div>

            <div class="element"> <label for="comments">Комментарии: </label> <input type="textarea" placeholder="Ваши комментарии о компоненте"></div>

        </div>

        </template>
</body>
    <footer>
        <div class="footer-content">
            <button class="footer-button" data-hash="#formulas" aria-label="formulas"> <img src="assets/icon-formulas.svg"> </button>
            </button>
            <button class="footer-button" data-hash="#ingredients" aria-label="ingridients"> <img src="assets/icon-plant.svg"> </button>
            <button class="footer-middle" data-hash="#home" aria-label="home"><img src="assets/icon-home.svg"></button>
            <button class="footer-button" data-hash="#maceration" aria-label="maceration"><img src="assets/icon-maceration.svg"></button>
            <button class="footer-button" data-hash="#settings" aria-label="settings"> <img src="assets/icon-settings.svg"> </button>
        </div>
    </footer>
</body>


</html>
