<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="64x64" href="assets/logo-a.png">
    <title>Aroma Journal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">

    <script src="js/index.js" type="module"></script> 
</head>
<body>
    <h1>Aroma Journal</h1>

    <main id="main-content">

    </template>

    </main>

        <template id="ingredient-modal-template">
            <div class="modal-overlay">
                <div class="journal-content modal-content"> 
                
                    <div class="element"> <label name="name">Название: <input type="text" placeholder="Введите название" class="js-ingredient-name"> </label>  </div>

                    <div class="element">     
                        <label name="amount">Количество: <input type="number" placeholder="Введите количество" class="js-ingredient-quantity">                 
                            <select name="measure" id="measure">
                            <option value="mg">мг</option>
                            <option value="ml">мл</option>
                        </select></label> 

                    </div>

                    <div class="element"> <label name="origin" class="js-ingredient-origin">Происхождение: <input type="text"> </label> </div>

                    <div class="element"> 
                        <label name="type" class="js-ingredient-type"> Тип:                 
                            <select name="type" id="type">
                            <option type="essentialOil">Эфирное масло</option>
                            <option type="absolute">Абсолют</option>
                            <option type="other">Другое</option>
                        </select> </label> 

                    </div>

                    <div class="element"> <label name="shelfLife" class="js-ingredient-shelfLife">Срок годности: <input type="date" id="date" name="date" > </label> </div>

                    <div class="element"> <label name="aromaProfile" class="js-ingredient-aroma">Ароматический профиль: <textarea placeholder="Описание аромата компонента"> </textarea> </label>  </div>

                    <div class="element"> <label name="comments" class="js-ingredient-comments">Комментарии: <textarea placeholder="Ваши комментарии о компоненте"> </textarea> </label> </div>
                    
                <div>
                    <button class="js-modal-save"> Сохранить </button> 
                    
                    <button class="js-modal-cancel"> Отмена </button>
                </div>

                </div>
            </div>

        </template>
</body>
    <footer>
        <div class="footer-content">
            <button class="footer-button" data-hash="#formulas" aria-label="formulas"> <img src="assets/icon-formulas.svg"> </button>
            </button>
            <button class="footer-button" data-hash="#ingredients" aria-label="ingridients"> <img src="assets/icon-plant.svg"> </button>
            <button class="footer-button" data-hash="#home" aria-label="home"><img src="assets/icon-home.svg"></button>
            <button class="footer-button" data-hash="#maceration" aria-label="maceration"><img src="assets/icon-maceration.svg"></button>
            <button class="footer-button" data-hash="#settings" aria-label="settings"> <img src="assets/icon-settings.svg"> </button>
        </div>
    </footer>
</body>


</html>
